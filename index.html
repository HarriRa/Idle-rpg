 fletchingXpBonus:0,craftingXpBonus:0,smithingXpBonus:0,alchemyXpBonus:0,enchantingXpBonus:0,miningXpBonus:0,defence:0,block:0,attack:0,strength:0};
 for(const name of Object.values(state.equipment)){const piece=EQUIPMENT[name]||{};for(const key of Object.keys(mods))mods[key]+=Number(piece[key]||0)}
 for(const buff of Object.values(state.buffs||{})){
  if(buff?.until>gameNow()&&buff.effects)for(const [key,value] of Object.entries(buff.effects))mods[key]=(mods[key]||0)+Number(value||0);
 }
 return mods;
}
function gainXp(skill,base,applyBonuses=true){
 const before=levelFromXp(state.xp[skill]||0);
 const mods=applyBonuses?gearMods():null;
 // Quest XP is fixed; gear and potion bonuses only affect trained XP.
 const amount=Math.max(0,applyBonuses?base*(1+mods.xpBonus+(mods[skill+'XpBonus']||0)):base);
 state.xp[skill]=(state.xp[skill]||0)+amount;
 queueActivityReward('xp',skill,amount);
 const after=levelFromXp(state.xp[skill]);
 if(after>before){
  if(skill==='hitpoints')state.hp=Math.min(maxHp(),state.hp+(after-before)*10);
  note(`✨ ${label(skill)} reached level ${after}!`);
  if(['attack','strength','defence','hitpoints','ranged','magic'].includes(skill))note(`⚔️ Combat level ${combatLevel()}/${COMBAT_CONFIG.maxLevel}`);
 }
 return amount;
}
function lightFire(item){
 if(!(item in FIRE_FUEL)||count(item)<1){note('No logs available.');return}
 const remaining=Math.max(0,(state.fireUntil-gameNow())/1000);
 if(remaining+FIRE_FUEL[item]>GAME_CONFIG.maxFireSeconds){note('Fire cannot hold more than 2 hours of fuel.');return}
 add(item,-1);state.fireUntil=Math.max(gameNow(),state.fireUntil)+FIRE_FUEL[item]*1000;
 state.fireLastFuel=item;state.stats.logsBurned++;
 note(`🔥 Added ${item}: +${timeFmt(FIRE_FUEL[item])} fire time.`);
 refreshDynamic();save();
}
const fireRemaining=()=>Math.max(0,(state.fireUntil-gameNow())/1000);
const fireBurning=()=>fireRemaining()>0;
// Relight only when a Cooking action needs heat. This uses simulated gameNow()
// during offline catch-up, so fuel durations and bank consumption work identically.
function nextAutoFuel(){
 if(!GAME_CONFIG.autoRelightCookingFire)return null;
 const previous=state.fireLastFuel;
 if(GAME_CONFIG.preferLastFirewood&&Object.hasOwn(FIRE_FUEL,previous)&&count(previous)>0)return previous;
 return Object.keys(FIRE_FUEL).find(item=>count(item)>0)||null;
}
function ensureCookingFire(){
 if(fireBurning())return true;
 const item=nextAutoFuel();
 if(!item||!add(item,-1))return false;
 state.fireUntil=gameNow()+FIRE_FUEL[item]*1000;
 state.fireLastFuel=item;
 state.stats.logsBurned++;
 note(`🔥 Automatically lit ${item} · ${timeFmt(FIRE_FUEL[item])} burn time.`);
 return true;
}
function startAction(skill,index){
 const action=SKILLS[skill]?.actions?.[index];if(!action)return;
 if(levelFromXp(state.xp[skill]||0)<action.level){note('Skill level too low.');return}
 if(!canPay(action.cost)){note('Not enough ingredients. Check the recipe.');return}
 if(action.requiresFire&&!ensureCookingFire()){note('🔥 Cooking needs logs in your bank to light the fire.');return}
 clearActivityFeed();state.active={type:'skill',skill,index};state.progress=0;note(`▶ ${action.name}`);renderProgress();refreshDynamic();save();
}
function startCombat(index){
 if(!MONSTERS[index])return;
 const problem=combatSupplyError();if(problem){note('⏹ '+problem);toast(problem);return}
 clearActivityFeed();state.monsterIndex=index;state.monsterHp=MONSTERS[index].hp;
 state.active={type:'combat'};state.progress=0;note(`⚔️ Fighting ${MONSTERS[index].name}`);renderProgress();refreshDynamic();save();
}
function stop(silent=false){state.active=null;state.progress=0;if(!silent)note('⏹ Activity stopped.');refreshDynamic();renderProgress();save()}
// Gathering bonuses over 100% grant guaranteed extras. Mythic gear therefore
// stays powerful instead of being silently limited to a 95% chance for +1.
function extraGatherAmount(skill){
 const mods=gearMods();
 const bonus=Math.max(0,(mods.gatherBonus||0)+(mods[skill+'Yield']||0));
 return Math.floor(bonus)+(Math.random()<bonus%1?1:0);
}
function completeSkill(){
 const {skill,index}=state.active||{};
 const action=SKILLS[skill]?.actions?.[index];if(!action){stop(true);return}
 if(!canPay(action.cost)){note('Out of materials. Action stopped.');stop(true);return}
 if(action.requiresFire&&!ensureCookingFire()){note('🔥 Out of logs! Cooking paused until you get more firewood.');stop(true);return}
 let quantity=action.quantity||1;
 if(['woodcutting','mining','fishing','agriculture'].includes(skill))quantity+=extraGatherAmount(skill);
 if(!buyOrCraft(action.cost,action.output,quantity)){note('🏦 Bank full: 1000 unique stacks. Free a slot to continue.');stop(true);return}
 if(skill==='enchanting'&&MAGIC_STAVES[action.output]){
  const base=Object.keys(action.cost||{}).find(item=>MAGIC_STAVES[item]);
  if(base){
   const charges=Math.max(0,state.staffCharges[base]||0);
   state.staffCharges[action.output]=Math.min(MAGIC_STAVES[action.output].maxCharges,(state.staffCharges[action.output]||0)+charges);
   state.staffCharges[base]=0; // no duplication when upgrading a charged staff
  }
 }
 const bonuses=[];
 if(action.bonus)for(const [item,n] of Object.entries(action.bonus)){
  if(add(item,n))bonuses.push(`${n} ${item}`);else note(`🏦 Extra ${item} could not fit in bank.`);
 }
 const xp=gainXp(skill,action.xp);
 if(['woodcutting','fishing','mining','agriculture'].includes(skill))rollSoulGem(skill);
 state.stats.bySkill[skill]=(state.stats.bySkill[skill]||0)+1;
 state.stats.produced[action.output]=(state.stats.produced[action.output]||0)+quantity;
 note(`+${fmt(quantity)} ${action.output}${bonuses.length?' + '+bonuses.join(', '):''} · +${Math.round(xp)} ${label(skill)} XP`);
}
function treasureChance(){return clamp(TREASURE_CHANCE*(1+gearMods().luckBonus),0,.95)}
function rollTreasure(){
 if(Math.random()>=treasureChance())return null;
 const total=TREASURE_TABLE.reduce((n,row)=>n+row[1],0);
 let roll=Math.random()*total;
 for(const [gem,w] of TREASURE_TABLE){roll-=w;if(roll<0)return gem}
 return TREASURE_TABLE.at(-1)[0];
}
// Weighted rolls are isolated: a Soul Gem can drop together with ANY other drop.
function weightedPick(table){
 if(!table?.length)return null;
 const total=table.reduce((n,row)=>n+Number(row.weight??row[1]??0),0);
 let roll=Math.random()*total;
 for(const row of table){roll-=Number(row.weight??row[1]??0);if(roll<0)return row}
 return table[table.length-1];
}
function soulGemChance(source){
 const base=source==='combat'?GAME_CONFIG.soulGemCombatChance:GAME_CONFIG.soulGemGatherChance;
 return clamp(base*(1+(gearMods().soulDropBonus||0)),0,.95);
}
function rollSoulGem(source){
 if(Math.random()>=soulGemChance(source))return null;
 const gem=weightedPick(SOUL_GEMS);
 if(!gem||!add(gem.name,1))return null;
 state.stats.soulsCollected=(state.stats.soulsCollected||0)+1;
 state.stats.soulsByTier[gem.name]=(state.stats.soulsByTier[gem.name]||0)+1;
 state.stats.soulsBySource[source]=(state.stats.soulsBySource[source]||0)+1;
 if(gem.name==='Prismatic Soul Gem')note('🌈 MYTHIC SOUL! Found the 1/3000 Prismatic Soul Gem!');
 else if(gem.weight<=29)note(`🌟 ${gem.name} found from ${label(source)}!`);
 return gem.name;
}
function rollMonsterGroup(m,kind){
 const table=m[kind+'Table'],chance=m[kind+'Chance']||0;
 if(!table?.length||Math.random()>=chance)return null;
 const row=weightedPick(table);if(!row)return null;
 const [item,,min=1,max=min]=row;
 const qty=Math.max(1,Math.floor(min+Math.random()*(max-min+1)));
 if(!add(item,qty))return null;
 return `${qty} ${item}`;
}
function applyMonsterLoot(m){
 const drops=[];
 for(const [item,amount] of Object.entries(m.loot||{})){
  const isCoins=item==='Coins';
  if(isCoins||Math.random()<.65){
   const qty=isCoins?Math.max(1,Math.floor(amount*(.6+.4*Math.random()))):Math.max(1,Math.ceil(Math.random()*amount));
   if(add(item,qty)){drops.push(`${qty} ${item}`);if(isCoins)state.stats.coinsEarned+=qty}
   else note(`🏦 Bank full; missed ${item} drop.`);
  }
 }
 // All side tables are separate rolls. Regular loot and treasure never replace them.
 for(const type of ['trash','seed','gem']){
  const drop=rollMonsterGroup(m,type);if(drop)drops.push(drop);
 }
 const soul=rollSoulGem('combat');if(soul)drops.push('💠 '+soul);
 // Soul Shards fuel spells. This independent drop roll never replaces Soul Gems,
 // treasure, uniques, monster gear components, normal loot or seeds.
 if(Math.random()<GAME_CONFIG.soulShardCombatChance){
  const qty=1+Math.floor(m.level/28)+Math.floor(Math.random()*2);
  if(add('Soul Shard',qty)){
   drops.push(`${qty} Soul Shard`);
   state.stats.soulShardsFound=(state.stats.soulShardsFound||0)+qty;
  }
 }
 if(m.componentDrop){
  const c=m.componentDrop;
  if(Math.random()<c.chance&&add(c.item,1)){drops.push(`✨ ${c.item}`);note(`✨ Arcane crafting drop: ${c.item}`)}
  if(c.extraItem&&Math.random()<c.extraChance&&add(c.extraItem,1))drops.push(`🏹 ${c.extraItem}`);
 }
 const treasure=rollTreasure();
 if(treasure){if(add(treasure,1)){drops.push(treasure);state.stats.treasures++}else note('🏦 Bank full; missed a gem drop.')}
 if(m.unique&&Math.random()<clamp(m.unique.chance*(1+gearMods().luckBonus),0,.95)){
  if(add(m.unique.item,1)){drops.push(`🌟 UNIQUE: ${m.unique.item}`);note(`🌟 RARE DROP! ${m.unique.item}`)}
  else note(`🏦 Bank full; missed unique ${m.unique.item}.`);
 }
 return drops;
}
function magicStaffEquipped(){
 const name=state.equipment.weapon;
 return name&&MAGIC_STAVES[name]?name:null;
}
function combatSupplyError(){
 if(state.combatStyle==='ranged'){
  const bow=state.equipment.weapon;
  if(EQUIPMENT[bow]?.combatType!=='ranged')return 'Equip a Bow from your bank to train Ranged.';
  const ammo=RANGED_AMMO[state.rangedAmmo];
  if(!ammo||count(state.rangedAmmo)<1)return 'No selected arrows in your bank. Fletch or buy arrows.';
  if(levelFromXp(state.xp.ranged||0)<ammo.level)return `Need Ranged level ${ammo.level} for ${state.rangedAmmo}.`;
 }
 if(state.combatStyle==='magic'){
  const staff=magicStaffEquipped();
  if(!staff)return 'Equip a Magic Staff to train Magic.';
  if((state.staffCharges[staff]||0)<1)return `${staff} is out of charges. Use Soul Shards to recharge it.`;
 }
 return null;
}
function chargeStaff(shardsRequested){
 const staff=magicStaffEquipped();
 if(!staff){note('🪄 Equip a Magic Staff first.');return}
 const limit=MAGIC_STAVES[staff].maxCharges;
 const current=Math.max(0,state.staffCharges[staff]||0);
 const free=limit-current;
 if(free<=0){note('🪄 This staff is already fully charged.');return}
 const amount=Math.min(Math.max(1,Math.floor(Number(shardsRequested)||1)),count('Soul Shard'),Math.ceil(free/GAME_CONFIG.magicChargesPerShard));
 if(amount<=0){note('🔹 Find Soul Shards from combat kills to recharge your staff.');return}
 if(!add('Soul Shard',-amount))return;
 const gain=Math.min(free,amount*GAME_CONFIG.magicChargesPerShard);
 state.staffCharges[staff]=current+gain;
 note(`🪄 Charged ${staff} +${gain} casts using ${amount} Soul Shard${amount>1?'s':''}.`);
 refreshDynamic();save();
}
function completeCombat(){
 const m=MONSTERS[state.monsterIndex],mods=gearMods();
 const supplyError=combatSupplyError();
 if(supplyError){note('⏹ '+supplyError);stop(true);return}
 const style=state.combatStyle;
 const attack=levelFromXp(state.xp.attack||0),strength=levelFromXp(state.xp.strength||0);
 const defence=levelFromXp(state.xp.defence||0);
 let accuracy,maxHit;
 if(style==='ranged'){
  const ammo=RANGED_AMMO[state.rangedAmmo];
  const ranged=levelFromXp(state.xp.ranged||0);
  accuracy=clamp((.62+.008*(ranged+mods.rangedAccuracy+ammo.accuracy-m.def))*(1+mods.rangedPct),.12,.98);
  maxHit=Math.max(1,Math.floor((2+Math.floor((ranged-1)/6)+mods.rangedPower+ammo.power)*(1+mods.rangedPct)));
  add(state.rangedAmmo,-1);state.stats.arrowsFired=(state.stats.arrowsFired||0)+1;
 }else if(style==='magic'){
  const staff=magicStaffEquipped(),magic=levelFromXp(state.xp.magic||0);
  accuracy=clamp((.64+.008*(magic+mods.magicAccuracy-m.def))*(1+mods.magicPct),.12,.98);
  maxHit=Math.max(1,Math.floor((3+Math.floor((magic-1)/6)+mods.magicPower)*(1+mods.magicPct)));
  state.staffCharges[staff]--;state.stats.magicCasts=(state.stats.magicCasts||0)+1;
 }else{
  accuracy=clamp((.62+.008*(attack+mods.attack-m.def))*(1+mods.attackPct),.12,.98);
  maxHit=Math.max(1,Math.floor((2+Math.floor((strength-1)/7)+mods.strength)*(1+mods.strengthPct)));
 }
 const damage=Math.random()<accuracy?1+Math.floor(Math.random()*maxHit):0;
 const actualDamage=Math.min(damage,state.monsterHp);
 state.monsterHp=Math.max(0,state.monsterHp-damage);
 const combatXp=actualDamage*5;
 if(combatXp>0){gainXp(style,combatXp);gainXp('hitpoints',combatXp/4)}
 if(state.monsterHp<=0){
  state.stats.kills[m.name]=(state.stats.kills[m.name]||0)+1;
  const drops=applyMonsterLoot(m);
  note(`🏆 Defeated ${m.name}! Loot: ${drops.join(', ')||'Nothing'}`);
  state.monsterHp=m.hp;
 }else{
  const effectiveDefence=defence*(1+mods.defencePct)+mods.defence;
  const hitChance=clamp(.65+.008*(m.atk-effectiveDefence),.10,.94);
  const rawHit=Math.random()<hitChance?1+Math.floor(Math.random()*m.maxHit):0;
  const mitigation=Math.floor((defence-1)/8)*(1+mods.defencePct)+(mods.block||0);
  const incoming=Math.max(0,rawHit-Math.floor(mitigation));
  state.hp=Math.max(0,state.hp-incoming);
 }
 tryAutoEat();
 if(state.hp<=0){state.hp=maxHp();note(`💔 Defeated by ${m.name}! Respawned at full HP.`);stop(true)}
}

function complete(){
 if(!state.active)return;
 // Capture rewards only from an actual online action. All XP and item sources
 // go through gainXp/add, including side tables, Soul Gems and combat uniques.
 const batch=new Map();activityRewardBatch=batch;
 try{if(state.active.type==='skill')completeSkill();else completeCombat()}
 finally{activityRewardBatch=null}
 receiveActivityRewards(batch);
 refreshDynamic();save();
}
function eat(item,auto=false){
 if(!FOOD[item]||count(item)<1)return false;
 if(state.hp>=maxHp())return false;
 const heal=Math.min(FOOD[item],maxHp()-state.hp);
 add(item,-1);state.hp+=heal;
 note(`🍽️ ${auto?'Auto Eat':'Ate'}: ${item} +${heal} HP`);
 return true;
}
function tryAutoEat(){
 const cfg=state.autoEat;if(!cfg.enabled||state.hp<=0||!FOOD[cfg.food])return;
 while(state.hp/maxHp()*100<=Number(cfg.threshold)&&state.hp<maxHp()&&count(cfg.food)>0)eat(cfg.food,true);
}
function usePotion(item){
 const pot=POTIONS[item];if(!pot||count(item)<1)return;
 if(pot.heal){
  if(state.hp>=maxHp()){note('Already at full HP.');return}
  const amount=Math.min(pot.heal,maxHp()-state.hp);add(item,-1);state.hp+=amount;note(`🧪 ${item} restored ${amount} HP.`);
 }else{
  const effects=pot.buffs||{[pot.buff]:pot.value};
  // Same category replaces (instead of infinitely stacking) an existing potion buff.
  const key=Object.keys(effects).sort().join(':');
  state.buffs[key]={name:item,until:gameNow()+pot.duration*1000,effects};
  add(item,-1);note(`🧪 Used ${item}: ${pot.description}.`);
 }
 state.stats.potionsUsed++;
 refreshDynamic();save();
}
function gearRequirement(item){
 const info=EQUIPMENT[item];if(!info)return {skill:null,level:1,met:false};
 const slot=info.slot,skill=info.requiredSkill||(slot==='weapon'?'attack':slot==='axe'?'woodcutting':slot==='pickaxe'?'mining':(['shield','head','body','legs','gloves','cape'].includes(slot)?'defence':null));
 const level=info.requiredLevel||1;
 return {skill,level,met:!skill||levelFromXp(state.xp[skill]||0)>=level};
}
function equip(item){
 const info=EQUIPMENT[item];if(!info||count(item)<1)return;
 const slot=info.slot,old=state.equipment[slot];
 const requirement=gearRequirement(item);
 if(!requirement.met){note(`${label(requirement.skill)} level ${requirement.level} is required to equip ${item}.`);return}
 // Removing one of the item first may free a stack for the replaced equipment.
 add(item,-1);
 if(old&&!add(old,1)){add(item,1);note('🏦 Bank full. Cannot swap equipment.');return}
 state.equipment[slot]=item;
 note(`🛡️ Equipped ${item} (${slot}).`);refreshDynamic();renderGearPicker();save();
}
function unequip(slot){
 if(!EQUIP_SLOTS.includes(slot))return;
 const item=state.equipment[slot];if(!item)return;
 if(!add(item,1)){note('🏦 Bank full. Free a stack before unequipping.');return}
 state.equipment[slot]=null;note(`Unequipped ${item}.`);refreshDynamic();renderGearPicker();save();
}
function sellPrice(item){return Math.max(1,baseSellPrice(item))}
function sell(item,qty){
 if(!count(item)||item==='Coins')return;
 if(!isTradeable(item)){note(`🔒 ${item} is soulbound and cannot be sold or traded.`);return;}
 qty=qty==='all'?count(item):Math.min(count(item),Math.max(1,Math.floor(Number(qty)||1)));
 const old={...state.bank},oldPotions={...state.potions};add(item,-qty);
 if(!add('Coins',sellPrice(item)*qty)){state.bank=old;state.potions=oldPotions;note('🏦 No space for Coins.');return}
 const coins=sellPrice(item)*qty;state.stats.coinsEarned+=coins;
 note(`🪙 Sold ${qty} ${item} for ${fmt(coins)} Coins.`);refreshDynamic();save();
}
function buy(item,qty){
 const offer=SHOP_ITEMS.find(x=>x.name===item);if(!offer||!isTradeable(item))return;
 qty=Math.min(1000,Math.max(1,Math.floor(Number(qty)||1)));
 const total=offer.price*qty;
 if(count('Coins')<total){note(`Need ${fmt(total-count('Coins'))} more Coins.`);toast('Not enough Coins');return}
 if(!buyOrCraft({Coins:total},item,qty)){note('🏦 Cannot buy: bank is full.');toast('Bank is full');return}
 note(`🛒 Bought ${fmt(qty)} ${item} for ${fmt(total)} Coins.`);refreshDynamic();save();
}
function questItemRewards(quest){
 const rewards={...(quest.items||{})};
 if(quest.coins>0)rewards.Coins=(rewards.Coins||0)+quest.coins;
 return rewards;
}
function questRewardSummary(quest){
 const parts=[];
 if(quest.coins>0)parts.push(`+${fmt(quest.coins)} Coins`);
 for(const [skill,n] of Object.entries(quest.xp||{}))if(n>0)parts.push(`+${fmt(n)} ${label(skill)} XP`);
 for(const [item,n] of Object.entries(quest.items||{}))if(n>0)parts.push(`+${fmt(n)} ${item}`);
 return parts.join(' · ');
}
function claimQuest(id){
 const quest=QUESTS.find(x=>x.id===id);
 if(!quest||state.claimed.includes(id)||!quest.test(state))return;
 const items=questItemRewards(quest);
 const newStacks=Object.entries(items).filter(([item,n])=>n>0&&!isPotion(item)&&count(item)===0).length;
 if(bankUsed()+newStacks>GAME_CONFIG.bankSlots){
  note(`🏦 Need ${bankUsed()+newStacks-GAME_CONFIG.bankSlots} free bank slot(s) to claim all rewards.`);
  toast('Free a bank slot for quest rewards');
  return;
 }
 const beforeBank={...state.bank},beforePotions={...state.potions};
 for(const [item,n] of Object.entries(items)){
  if(n<=0)continue;
  if(!add(item,n)){
   state.bank=beforeBank;state.potions=beforePotions;
   note('🏦 Could not claim all rewards. Inventory unchanged.');
   return;
  }
 }
 // Claiming unlocks the next tier. Its progress uses the same lifetime total,
 // so previously completed actions count automatically toward higher tiers.
 // Never reward XP until all items are safely deposited.
 for(const [skill,amount] of Object.entries(quest.xp||{}))if(amount>0)gainXp(skill,amount,false);
 state.claimed.push(quest.id);
 state.stats.coinsEarned=(state.stats.coinsEarned||0)+(quest.coins||0);
 note(`🏅 Journal completed: ${quest.title}! ${questRewardSummary(quest)}`);
 refreshDynamic(); // Journal redraw removes claimed card immediately.
 save();
}

function navIcon(v){return NAV_META[v]?.[0]||SKILLS[v]?.icon||'🔹'}
function renderNav(){

 `${i===1?'<div class="nav-divider">Skills</div>':''}${v==='bank'?'<div class="nav-divider">Inventory & Goals</div>':''}
 <button class="${ui.view===v?'selected':''}" data-nav="${esc(v)}"><span>${navIcon(v)} ${viewLabel(v)}</span><small data-nav-lvl="${esc(v)}">${v==='combat'?'Lv '+combatLevel():SKILLS[v]?'Lv '+levelFromXp(state.xp[v]||0):v==='bank'?bankUsed()+'/'+GAME_CONFIG.bankSlots:v==='shop'?fmt(count('Coins'))+'🪙':''}</small></button>`).join('');
 const select=el('mobileSelect');select.innerHTML=NAV_VIEWS.map(v=>`<option value="${v}">${navIcon(v)} ${viewLabel(v)}</option>`).join('');select.value=ui.view;

function refreshNavLevels(){

 if(ui.view==='combat')renderCombatMain();
 else if(ui.view==='bank')renderBankMain();
 else if(ui.view==='shop')renderShopMain();
 else if(ui.view==='journal')renderJournalMain();
 else renderSkillMain(ui.view);
 updateFireUi();renderProgress();
}
function renderLog(){
 const box=el('log');if(!box)return;
 box.innerHTML=state.log.slice(0,35).map(x=>`<div class="${x.includes('reached level')?'level-msg':x.includes('RARE DROP')||x.includes('Defeated')?'loot-msg':''}">${esc(x)}</div>`).join('');
}
function renderProgress(){
 const current=state.active;
 let name='Idle · Choose an action';
 if(current?.type==='skill'){
  const action=SKILLS[current.skill]?.actions[current.index];
  name=action?`${SKILLS[current.skill].icon} ${action.name} · ${label(current.skill)}`:'Idle';
 }else if(current?.type==='combat'){
  const mob=MONSTERS[state.monsterIndex];
  name=`⚔️ ${mob.name} · Enemy ${Math.ceil(Math.max(0,state.monsterHp))}/${mob.hp} HP · You ${state.hp}/${maxHp()} HP`;
 }
 el('activityName').textContent=name;el('activityName').title=name;el('progressFill').style.width=clamp(state.progress||0,0,100)+'%';
 el('progressText').textContent=Math.floor(clamp(state.progress||0,0,100))+'%';
 el('stopBtn').disabled=!current;
}
function refreshSummary(){
 el('summary').innerHTML=`<span class="stat">⚔️ Combat <b>${combatLevel()}/${COMBAT_CONFIG.maxLevel}</b></span><span class="stat">❤️ <b>${Math.ceil(state.hp)}/${maxHp()}</b> HP</span><span class="stat">🪙 <b>${fmt(count('Coins'))}</b></span><span class="stat">🏦 <b>${fmt(bankUsed())}/${GAME_CONFIG.bankSlots}</b> stacks</span><span class="stat">${state.active?'⚡ Working':'💤 Idle'}</span>`;
}
function refreshDynamic(){
 refreshSummary();refreshNavLevels();
 if(ui.view==='combat')renderCombatLive();
 else if(SKILLS[ui.view]&&!SKILLS[ui.view].combat)renderSkillLive();
 else if(ui.view==='bank')renderBankGrid('main');
 else if(ui.view==='shop')renderShopItems();
 else if(ui.view==='journal')renderJournalMain();
 if(ui.sidebarTab==='bank')renderBankGrid('side');
 else{
  const parent=el('sidebar').closest('.right');const scroll=parent.scrollTop;
  if(ui.sidebarTab==='gear')renderGearSidebar();else renderPotionPouch();
  parent.scrollTop=scroll;
 }
 if(!el('gearOverlay').hidden)renderGearPicker();
 renderProgress();
}
function render(){renderNav();renderMain();renderSidebar();renderLog();refreshDynamic();renderActivityFeed()}
// ── Interaction via event delegation: controls remain functional after redraw ──
function handleClick(e){
 const b=e.target.closest('button');if(!b||b.disabled)return;
 if(b.hasAttribute('data-nav'))return navigate(b.dataset.nav);
 if(b.hasAttribute('data-action'))return startAction(ui.view,Number(b.dataset.action));
 if(b.hasAttribute('data-monster'))return startCombat(Number(b.dataset.monster));
 if(b.hasAttribute('data-charge'))return chargeStaff(Number(b.dataset.charge));
 if(b.hasAttribute('data-combat-style')){
  state.combatStyle=b.dataset.combatStyle;save();renderMain();refreshDynamic();return;
 }
 if(b.hasAttribute('data-skill-tab')){ui.skillTab[ui.view]=b.dataset.skillTab;renderMain();refreshDynamic();return}
 if(b.hasAttribute('data-shop-cat')){ui.shopCategory=b.dataset.shopCat;renderMain();refreshDynamic();return}
 if(b.hasAttribute('data-buy'))return buy(b.dataset.buy,ui.shopQty);
 if(b.hasAttribute('data-burn'))return lightFire(b.dataset.burn);
 if(b.hasAttribute('data-gear-slot'))return openGearSlot(b.dataset.gearSlot);
 if(b.hasAttribute('data-equip'))return equip(b.dataset.equip);
 if(b.hasAttribute('data-unequip'))return unequip(b.dataset.unequip);
 if(b.hasAttribute('data-eat')){if(!eat(b.dataset.eat))note('Cannot eat now.');refreshDynamic();save();return}
 if(b.hasAttribute('data-use-potion'))return usePotion(b.dataset.usePotion);
 if(b.hasAttribute('data-sell'))return sell(b.dataset.sell,b.dataset.qty);
 if(b.hasAttribute('data-claim'))return claimQuest(b.dataset.claim);
 if(b.hasAttribute('data-journal-category')){ui.journalCategory=b.dataset.journalCategory;renderJournalMain();return;}
 if(b.hasAttribute('data-bank-tab'))return bankSelectTab(b.dataset.bankTab,b.dataset.tabId);
 if(b.hasAttribute('data-bank-new'))return bankCreateTab();
 if(b.hasAttribute('data-bank-rename'))return bankRenameTab(b.dataset.bankRename);
 if(b.hasAttribute('data-bank-delete'))return bankDeleteTab(b.dataset.bankDelete);
 if(b.hasAttribute('data-bank-select')){
  const scope=b.dataset.bankSelect;ui.bank[scope].selected=b.dataset.item;
  renderBankGrid(scope);return;
 }
 if(b.hasAttribute('data-bank-page')){
  const scope=b.dataset.bankPage;ui.bank[scope].page+=Number(b.dataset.delta);renderBankGrid(scope);return;
 }
}
function handleInput(e){
 const t=e.target;
 if(t.hasAttribute('data-bank-search')){
  const scope=t.dataset.bankSearch;ui.bank[scope].search=t.value;ui.bank[scope].page=0;renderBankGrid(scope);
 }
 if(t.hasAttribute('data-bank-move')&&t.value){
  bankMoveItem(t.dataset.item,t.value);
 }
 if(t.id==='shopQty'){ui.shopQty=Number(t.value);renderShopItems()}
 if(t.id==='rangedAmmo'&&RANGED_AMMO[t.value]&&count(t.value)>0){state.rangedAmmo=t.value;renderCombatResources();save()}
 if(t.id==='autoEatEnabled'){state.autoEat.enabled=t.checked;save()}
 if(t.id==='autoEatFood'){if(count(t.value)>0&&Object.hasOwn(FOOD,t.value)){state.autoEat.food=t.value;renderAutoEatOptions();save()}}
 if(t.id==='autoEatThreshold'){state.autoEat.threshold=Number(t.value);save()}
}
// Drag-and-drop on desktop: drop a bank tile on a folder to move its whole stack.
let bankDraggingItem=null;
function bankDragStart(e){
 const tile=e.target.closest('.bank-tile[draggable="true"]');if(!tile)return;
 bankDraggingItem=tile.dataset.item;
 e.dataTransfer.effectAllowed='move';e.dataTransfer.setData('text/plain',bankDraggingItem);
 tile.classList.add('dragging');
}
function bankDragOver(e){
 const tab=e.target.closest('[data-bank-tab]');if(!tab||!bankDraggingItem)return;
 e.preventDefault();e.dataTransfer.dropEffect='move';tab.classList.add('bank-drop-target');
}
function bankDragLeave(e){const tab=e.target.closest('[data-bank-tab]');if(tab&&!tab.contains(e.relatedTarget))tab.classList.remove('bank-drop-target')}
function bankDrop(e){
 const tab=e.target.closest('[data-bank-tab]');if(!tab||!bankDraggingItem)return;
 e.preventDefault();tab.classList.remove('bank-drop-target');
 const item=bankDraggingItem;bankDraggingItem=null;bankMoveItem(item,tab.dataset.tabId);
}
function bankDragEnd(){bankDraggingItem=null;document.querySelectorAll('.bank-drop-target').forEach(n=>n.classList.remove('bank-drop-target'));document.querySelectorAll('.bank-tile.dragging').forEach(n=>n.classList.remove('dragging'))}
for(const root of [el('main'),el('sidebar')]){
 root.addEventListener('dragstart',bankDragStart);
 root.addEventListener('dragover',bankDragOver);
 root.addEventListener('dragleave',bankDragLeave);
 root.addEventListener('drop',bankDrop);
 root.addEventListener('dragend',bankDragEnd);
}
el('main').addEventListener('click',handleClick);
el('sidebar').addEventListener('click',handleClick);
el('gearOverlay').addEventListener('click',e=>{
 if(e.target===el('gearOverlay'))return closeGearSlot();
 const btn=e.target.closest('button');if(!btn||btn.disabled)return;
 if(btn.hasAttribute('data-gear-close'))return closeGearSlot();
 if(btn.hasAttribute('data-equip'))return equip(btn.dataset.equip);
 if(btn.hasAttribute('data-unequip'))return unequip(btn.dataset.unequip);
});
document.addEventListener('keydown',e=>{if(e.key==='Escape'&&!el('gearOverlay').hidden)closeGearSlot()});
el('nav').addEventListener('click',handleClick);
el('main').addEventListener('input',handleInput);
el('sidebar').addEventListener('input',handleInput);
el('main').addEventListener('change',handleInput);
el('sidebar').addEventListener('change',handleInput);
el('mobileSelect').onchange=ev=>navigate(ev.target.value);
el('stopBtn').onclick=()=>stop();
el('bankTab').onclick=()=>{ui.sidebarTab='bank';renderSidebar()};
el('gearTab').onclick=()=>{ui.sidebarTab='gear';renderSidebar()};
el('potionTab').onclick=()=>{ui.sidebarTab='potions';renderSidebar()};
el('saveBtn').onclick=()=>{save();note('💾 Game saved.')};
el('exportBtn').onclick=()=>{
 save();const blob=new Blob([JSON.stringify(state,null,2)],{type:'application/json'});
 const url=URL.createObjectURL(blob),anchor=document.createElement('a');anchor.href=url;
 anchor.download='idle-rpg-save.json';anchor.click();setTimeout(()=>URL.revokeObjectURL(url),3000);
};
el('importBtn').onclick=()=>el('fileInput').click();
el('fileInput').onchange=async e=>{
 const file=e.target.files?.[0];if(!file)return;
 try{
  const data=JSON.parse(await file.text());if(!data.xp||!data.bank||typeof data.xp!=='object'||typeof data.bank!=='object')throw Error('Invalid save file');
  localStorage.setItem(SAVE_KEY,JSON.stringify(data));clearActivityFeed();restore();render();note('💾 Save imported successfully.');
 }catch(err){alert('Could not import save: '+err.message)}e.target.value='';
};
el('resetBtn').onclick=()=>{
 if(confirm('Reset all progress, bank items, equipment, quests and Coins? This cannot be undone unless you exported a save.')){
  state=newGame();clearActivityFeed();save();render();note('New adventure started!');
 }
};
function validSavedActivity(active){
 if(!active||typeof active!=='object')return false;
 if(active.type==='combat')return true;
 return active.type==='skill'&&!!SKILLS[active.skill]?.actions?.[active.index];
}
function offlineSnapshot(){
 return {bank:{...state.bank,...state.potions},xp:{...state.xp},kills:{...state.stats.kills},combat:combatLevel(),
         level:Object.fromEntries(Object.keys(state.xp).map(k=>[k,levelFromXp(state.xp[k]||0)]))};
}
const afkDuration=seconds=>{
 seconds=Math.floor(Math.max(0,seconds));
 const h=Math.floor(seconds/3600),m=Math.floor(seconds%3600/60),s=seconds%60;
 return `${h}h ${String(m).padStart(2,'0')}m ${String(s).padStart(2,'0')}s`;
};
function afkCard(name,qty,negative=false){
 const q=negative?'-':'+';
 return `<div class="afk-item ${negative?'used':''}">${itemArt(name)}<div class="detail">${esc(name)}</div><b>${q}${fmt(Math.abs(qty))}</b></div>`;
}
function afkSection(title,items){return items.length?`<section class="afk-section"><h3>${title}</h3><div class="afk-list">${items.join('')}</div></section>`:''}
function showOfflineReport(before,seconds,rewarded,actionName,actions){
 const after=offlineSnapshot(),added=[],spent=[],xp=[],levels=[],kills=[];
 for(const item of new Set([...Object.keys(before.bank),...Object.keys(after.bank)])){
  const delta=(after.bank[item]||0)-(before.bank[item]||0);
  if(delta>0)added.push([item,delta]);else if(delta<0)spent.push([item,-delta]);
 }
 for(const skill of Object.keys(after.xp)){
  const delta=(after.xp[skill]||0)-(before.xp[skill]||0);
  if(delta>0)xp.push([skill,delta]);
  if((after.level[skill]||1)>(before.level[skill]||1))levels.push([skill,before.level[skill],after.level[skill]]);
 }
 for(const name of Object.keys(after.kills)){
  const delta=(after.kills[name]||0)-(before.kills[name]||0);
  if(delta>0)kills.push([name,delta]);
 }
 added.sort((a,b)=>b[1]-a[1]);spent.sort((a,b)=>b[1]-a[1]);
 el('afkReport').innerHTML=`<div class="afk-hero"><div class="subdued small">TIME AWAY</div><div class="afk-time">${afkDuration(seconds)}</div><strong>${esc(actionName)}</strong><p class="small subdued">${fmt(actions)} actions completed · ${afkDuration(rewarded)} rewarded${seconds>rewarded?' (24-hour limit)':''}</p></div>`+
 afkSection('🎒 Items collected',added.filter(([n])=>!NONTRADEABLE_ITEMS.has(n)).map(([n,v])=>afkCard(n,v)))+
 afkSection('💠 Soul Gems & Shards found (soulbound)',added.filter(([n])=>NONTRADEABLE_ITEMS.has(n)).map(([n,v])=>afkCard(n,v)))+
 afkSection('✨ Experience earned',xp.map(([n,v])=>`<div class="afk-item"><span>${SKILLS[n]?.icon||'⭐'}</span><div class="detail">${esc(label(n))}</div><b>+${Number(v.toFixed(2)).toLocaleString('en-US')} XP</b></div>`))+
 afkSection('🎉 Level ups',levels.map(([n,a,b])=>`<div class="afk-item"><span>${SKILLS[n]?.icon||'⭐'}</span><div class="detail">${esc(label(n))}</div><b>Lv ${a} → ${b}</b></div>`))+
 (after.combat>before.combat?`<div class="info-box">⚔️ Combat Level ${before.combat} → <strong>${after.combat}</strong></div>`:'')+
 afkSection('🏆 Monsters defeated',kills.map(([n,v])=>`<div class="afk-item"><span>⚔️</span><div class="detail">${esc(n)}</div><b>×${fmt(v)}</b></div>`))+
 afkSection('📦 Materials / food consumed',spent.map(([n,v])=>afkCard(n,v,true)))+
 (!added.length&&!xp.length?'<p class="section-description">No rewards collected. You may have run out of supplies, fire, or health.</p>':'')+
 `<p class="small subdued">Items were stored automatically in your bank or Potion Pouch. ${state.active?'Your previous action will continue.':'Your activity stopped while you were away.'}</p>`;
 el('afkOverlay').hidden=false;
}
async function catchUpOffline(){
 if(offlineRunning||!OFFLINE_CONFIG.enabled)return;
 const now=Date.now(),start=Number(state.lastProcessedAt)||now;
 const gap=Math.max(0,now-start),minMs=OFFLINE_CONFIG.minAwaySeconds*1000;
 if(gap<minMs||!state.active){state.lastProcessedAt=now;return}
 const capMs=Math.max(0,OFFLINE_CONFIG.maxHours)*3600000;
 const rewardedMs=Math.min(gap,capMs),end=start+rewardedMs;
 const actionName=state.active.type==='combat'?`⚔️ ${MONSTERS[state.monsterIndex]?.name||'Combat'}`:
    `${SKILLS[state.active.skill]?.icon||'⚡'} ${SKILLS[state.active.skill]?.actions[state.active.index]?.name||'Activity'}`;
 const before=offlineSnapshot(),actionMs=Math.max(100,Number(state.actionMs)||GAME_CONFIG.actionMs);
 clearActivityFeed(); // The AFK report handles rewards while the page is away.
 let completed=0,clock=start,progressMs=(Number(state.progress)||0)/100*actionMs;
 offlineRunning=true;simulatedTime=clock;
 el('afkOverlay').hidden=false;
 el('afkReport').innerHTML=`<div class="afk-hero"><h3>Calculating offline progress…</h3><div class="afk-progress"><div id="afkCalcFill"></div></div><div class="subdued small" id="afkCalcText">0%</div></div>`;
 el('afkContinue').hidden=true;
 try{
  let i=0;
  while(clock<end&&state.active){
   const remaining=actionMs-progressMs;
   const next=clock+remaining;
   if(next>end){progressMs+=end-clock;clock=end;break}
   clock=next;simulatedTime=clock;
   // Shared completion routines: loot rolls, XP, buffs, costs, auto-eat and death.
   if(state.active.type==='skill')completeSkill();else completeCombat();
   completed++;progressMs=0;
   if(++i>=OFFLINE_CONFIG.chunkActions){
    i=0;
    const percent=Math.floor((clock-start)/Math.max(1,rewardedMs)*100);
    if(el('afkCalcFill'))el('afkCalcFill').style.width=percent+'%';
    if(el('afkCalcText'))el('afkCalcText').textContent=percent+'%';
    await new Promise(resolve=>setTimeout(resolve,0));
   }
  }
  state.progress=state.active?clamp(progressMs/actionMs*100,0,99.999):0;
  state.lastProcessedAt=now;
 }finally{
  simulatedTime=null;offlineRunning=false;
  lastTick=performance.now();lastUiPulse=lastTick;
 }
 note(`🌙 Offline: ${fmt(completed)} actions while away (${afkDuration(rewardedMs/1000)} rewarded).`);
 save();render();
 showOfflineReport(before,gap/1000,rewardedMs/1000,actionName,completed);
 el('afkContinue').hidden=false;
}
el('afkContinue').onclick=()=>{el('afkOverlay').hidden=true;el('afkContinue').hidden=false;};
function tick(t){
 if(offlineRunning){lastTick=t;requestAnimationFrame(tick);return}
 const wallGap=Date.now()-(state.lastProcessedAt||Date.now());
 if(wallGap>=OFFLINE_CONFIG.minAwaySeconds*1000&&state.active){catchUpOffline();lastTick=t;requestAnimationFrame(tick);return}
 let dt=clamp(t-lastTick,0,250);lastTick=t;
 updateActivityFeed(t);
 if(state.active){
  state.progress+=dt/(Number(state.actionMs)||GAME_CONFIG.actionMs)*100;
  if(state.progress>=100){state.progress-=100;complete()}
  renderProgress();
 }
 state.lastProcessedAt=Date.now();
 // Potion / fire counters use wall time. Updating once per second avoids excess DOM churn.
 if(t-lastUiPulse>1000){lastUiPulse=t;
  if(ui.view==='cooking')updateFireUi();
  if(ui.view==='combat'){
   if(el('boostTreasure'))el('boostTreasure').textContent=pct(treasureChance());
   if(el('treasureCurrent'))el('treasureCurrent').textContent=pct(treasureChance());
   const weightSum=TREASURE_TABLE.reduce((sum,r)=>sum+r[1],0);
   for(const node of el('main').querySelectorAll('[data-gem-chance]'))node.textContent=pct(treasureChance()*Number(node.dataset.gemChance)/weightSum);
   renderBuffs();
  }
 }
 if(t-lastSavedFrame>15000){lastSavedFrame=t;save()}
 requestAnimationFrame(tick);
}
// Persist the precise time of the last simulated game tick when leaving.
window.addEventListener('pagehide',save);
document.addEventListener('visibilitychange',()=>{if(document.hidden)save();});
async function boot(){restore();render();if(state.active)await catchUpOffline();lastTick=performance.now();requestAnimationFrame(tick)}
boot();
// Expose test helpers for regression checks.
window.IdleRPGDebug={getState:()=>state,levelFromXp,xpForLevel,combatLevel,bankUsed,fireRemaining,treasureChance,add,lightFire,buy,sell,equip,complete,stop,navigate,rollSoulGem,soulGemChance,rollMonsterGroup,isTradeable};
