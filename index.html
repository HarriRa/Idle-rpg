 ['Cook Lobster','Cooked Lobster',45,115,{'Lobster':1}],
 ['Cook Swordfish','Cooked Swordfish',55,150,{'Swordfish':1}],
 ['Cook Monkfish','Cooked Monkfish',65,200,{'Monkfish':1}],
 ['Cook Shark','Cooked Shark',75,260,{'Shark':1}],
 ['Cook Manta Ray','Cooked Manta Ray',85,350,{'Manta Ray':1}],

agriculture:{icon:'🌱',actions:[['Grow Herbs','Herb',1,20],['Grow Potatoes','Potato',5,30],['Grow Berries','Berries',12,45],['Raise Chickens','Egg',1,20],['Tend Sheep','Wool',8,35],['Milk Cows','Milk',15,50]]},
herblore:{icon:'🧪',actions:[['Brew Healing Potion','Healing Potion',1,45,{'Herb':2,'Berries':1}],['Brew Strength Potion','Strength Potion',10,70,{'Herb':3,'Potato':1}]]},
attack:{icon:'🗡️',combat:true},strength:{icon:'💪',combat:true},defence:{icon:'🛡️',combat:true},hitpoints:{icon:'❤️',name:'Hitpoints',combat:true}
};
const MONSTERS=[
 {name:'Rat',level:1,hp:10,def:1,atk:1,maxHit:2,loot:{'Rat Tail':1},xp:12},
 {name:'Goblin',level:8,hp:35,def:7,atk:8,maxHit:5,loot:{'Coins':8},xp:30},
 {name:'Skeleton',level:18,hp:85,def:16,atk:18,maxHit:10,loot:{'Bones':2},xp:65},
 {name:'Forest Guardian',level:30,hp:165,def:28,atk:30,maxHit:18,loot:{'Ancient Token':1},xp:140},
 {name:'Cave Troll',level:50,hp:300,def:46,atk:50,maxHit:28,loot:{'Troll Fang':1,'Coins':35},xp:240},
 {name:'Abyss Warden',level:70,hp:520,def:68,atk:70,maxHit:44,loot:{'Abyss Shard':1,'Coins':75},xp:480},
 {name:'Ancient Dragon',level:90,hp:850,def:87,atk:90,maxHit:64,loot:{'Dragon Scale':2,'Coins':150},xp:800}
];
const TREASURE_TABLE=[['Uncut Opal',40],['Uncut Jade',24],['Uncut Red Topaz',17],['Uncut Sapphire',11],['Uncut Emerald',6],['Uncut Ruby',3],['Uncut Diamond',2],['Uncut Dragonstone',0.7],['Uncut Onyx',0.2],['Uncut Zenyte',0.1]];
const TREASURE_CHANCE=0.10; // 10% per monster kill; weights above decide which gem.
// Heals are scaled for 10 HP at level 1 and up to 990 HP at level 99.
const FOOD={
 'Cooked Shrimp':4,'Cooked Sardine':6,'Cooked Herring':8,
 'Cooked Trout':12,'Cooked Salmon':18,'Cooked Tuna':28,
 'Cooked Lobster':45,'Cooked Swordfish':70,'Cooked Monkfish':95,
 'Cooked Shark':135,'Cooked Manta Ray':185,'Cooked Leviathan':250,
 'Potato':6,'Berries':4,'Egg':5,'Milk':8
};
const EQUIPMENT={
 'Bronze Sword':{slot:'weapon',attack:4,strength:2},
 'Iron Sword':{slot:'weapon',attack:9,strength:4},
 'Steel Sword':{slot:'weapon',attack:17,strength:7},
 'Mithril Sword':{slot:'weapon',attack:30,strength:11},
 'Rune Sword':{slot:'weapon',attack:46,strength:16},
 'Wooden Shield':{slot:'shield',defence:4,block:1},
 'Oak Shield':{slot:'shield',defence:8,block:2},
 'Iron Shield':{slot:'shield',defence:14,block:3},
 'Steel Shield':{slot:'shield',defence:24,block:5},
 'Mithril Shield':{slot:'shield',defence:38,block:8},
 'Rune Shield':{slot:'shield',defence:58,block:13}
};
const SAVE_KEY='idle-rpg-v2-save';const newGame=()=>({xp:Object.fromEntries(Object.keys(SKILLS).map(k=>[k,0])),bank:{},equipment:{weapon:null,shield:null},hp:10,monsterHp:null,monsterIndex:0,combatStyle:'attack',autoEat:{enabled:false,food:'Cooked Shrimp',threshold:30},active:null,progress:0,actionMs:1000,log:[],lastSaved:Date.now()});let state=newGame(),currentSkill='combat',agricultureTab='crops',craftingTab='equipment',sidebarTab='bank',lastTick=performance.now();
const levelFromXp=xp=>{let lvl=1,total=0;while(lvl<99){let needed=Math.floor(100*Math.pow(1.13,lvl-1));if(xp<total+needed)break;total+=needed;lvl++}return lvl};
const xpForLevel=lvl=>{let n=0;for(let i=1;i<lvl;i++)n+=Math.floor(100*Math.pow(1.13,i-1));return n};
const maxHp=()=>Math.min(990,levelFromXp(state.xp.hitpoints||0)*10);
const clamp=(n,min,max)=>Math.max(min,Math.min(max,n));

const label=s=>SKILLS[s].name||s.replace(/([A-Z])/g,' $1').replace(/^./,c=>c.toUpperCase());
const count=item=>state.bank[item]||0;const add=(item,n=1)=>{state.bank[item]=Math.max(0,count(item)+n);if(!state.bank[item])delete state.bank[item]};
const canPay=cost=>!cost||Object.entries(cost).every(([item,n])=>count(item)>=n);
function note(msg){state.log.unshift(msg);state.log=state.log.slice(0,35);renderLog()}
function gainXp(skill,n){
 const before=levelFromXp(state.xp[skill]||0);
 state.xp[skill]=(state.xp[skill]||0)+n;
 const after=levelFromXp(state.xp[skill]);
 if(after>before){
  if(skill==='hitpoints')state.hp=Math.min(after*10,state.hp+(after-before)*10);
  note(`✨ ${label(skill)} reached level ${after}!`);
 }
}
function save(){state.lastSaved=Date.now();localStorage.setItem(SAVE_KEY,JSON.stringify(state))}
function restore(){
 try{
  const s=JSON.parse(localStorage.getItem(SAVE_KEY));
  if(!s||!s.xp||!s.bank)return;
  const base=newGame();
  state={...base,...s,xp:{...base.xp,...s.xp},equipment:{...base.equipment,...s.equipment},autoEat:{...base.autoEat,...(s.autoEat||{})},active:null,progress:0,monsterHp:null};
  // Existing saves: former Farming / Animal Husbandry XP becomes Agriculture XP.
  if(s.xp.agriculture===undefined&&(s.xp.farming!==undefined||s.xp.animalHusbandry!==undefined)){
   state.xp.agriculture=(s.xp.farming||0)+(s.xp.animalHusbandry||0);
  }
  delete state.xp.farming;delete state.xp.animalHusbandry;
  // Older games had 100 max HP and no Hitpoints skill: preserve their HP percentage.
  if(s.xp.hitpoints===undefined){
   state.xp.hitpoints=((s.xp.attack||0)+(s.xp.strength||0)+(s.xp.defence||0))*0.25;
   state.hp=Math.max(1,Math.round((Number(s.hp)||100)/100*maxHp()));
  }
  state.hp=clamp(Number(state.hp)||1,1,maxHp());
  if(!['attack','strength','defence'].includes(state.combatStyle))state.combatStyle='attack';
  if(!MONSTERS[state.monsterIndex])state.monsterIndex=0;
  if(!FOOD[state.autoEat.food])state.autoEat.food='Cooked Shrimp';
  if(![15,30,50].includes(Number(state.autoEat.threshold)))state.autoEat.threshold=30;
  const away=Math.min(8*3600,Math.max(0,(Date.now()-(s.lastSaved||Date.now()))/1000));
  if(away>60)note(`Welcome back! You were away for ${Math.floor(away/60)} minutes. Offline actions are paused in this prototype.`);
 }catch(e){console.warn('Save could not be read',e)}
}
function startAction(skill,index){let a=SKILLS[skill].actions[index];if(levelFromXp(state.xp[skill])<a[2])return;if(!canPay(a[4])){note('Missing ingredients.');return}state.active={type:'skill',skill,index};state.progress=0;render()}
function startCombat(index){state.monsterIndex=index;state.monsterHp=MONSTERS[index].hp;state.active={type:'combat'};state.progress=0;note(`⚔️ Fighting ${MONSTERS[index].name}`);render()}
function eat(item){
 if(!FOOD[item]||count(item)<1){note('No food available.');return}
 const limit=maxHp();
 if(state.hp>=limit){note('Already at full HP.');return}
 add(item,-1);
 const healed=Math.min(FOOD[item],limit-state.hp);
 state.hp+=healed;
 note(`🍽️ Ate ${item}: +${healed} HP`);
 save();renderDynamic();
}
function tryAutoEat(){
 const cfg=state.autoEat,limit=maxHp();
 if(!cfg?.enabled||!FOOD[cfg.food]||state.hp<=0)return;
 while(state.hp/limit*100<=Number(cfg.threshold)&&state.hp<limit&&count(cfg.food)>0){
  const healed=Math.min(FOOD[cfg.food],limit-state.hp);
  add(cfg.food,-1);state.hp+=healed;
  note(`🍽️ Auto Eat: ${cfg.food} +${healed} HP`);
 }
}
function rollTreasure(){if(Math.random()>=TREASURE_CHANCE)return null;const total=TREASURE_TABLE.reduce((n,row)=>n+row[1],0);let roll=Math.random()*total;for(const [gem,weight] of TREASURE_TABLE){roll-=weight;if(roll<0)return gem}return TREASURE_TABLE.at(-1)[0]}
function stop(){state.active=null;state.progress=0;render()}
function complete(){
 if(!state.active)return;
 if(state.active.type==='skill'){
  const {skill,index}=state.active,a=SKILLS[skill].actions[index];
  if(!canPay(a[4])){note('Not enough materials. Action stopped.');stop();return}
  for(const [item,n] of Object.entries(a[4]||{}))add(item,-n);
  add(a[1]);gainXp(skill,a[3]);
  note(`+1 ${a[1]} · +${a[3]} ${label(skill)} XP`);
 }else{
  const m=MONSTERS[state.monsterIndex];
  const weapon=EQUIPMENT[state.equipment.weapon]||{};
  const shield=EQUIPMENT[state.equipment.shield]||{};
  const attack=levelFromXp(state.xp.attack),strength=levelFromXp(state.xp.strength),defence=levelFromXp(state.xp.defence);
  // One action is one attack exchange. Better gear can offset lower levels.
  const accuracy=clamp(.62+.008*(attack+(weapon.attack||0)-m.def),.12,.94);
  const playerMaxHit=2+Math.floor((strength-1)/7)+(weapon.strength||0);
  const damage=Math.random()<accuracy?1+Math.floor(Math.random()*playerMaxHit):0;
  const actualDamage=Math.min(damage,state.monsterHp);
  state.monsterHp=Math.max(0,state.monsterHp-damage);
  // Successful damage awards the selected combat skill XP; HP gains exactly 25% of it.
  const combatXp=actualDamage*5;
  if(combatXp>0){gainXp(state.combatStyle,combatXp);gainXp('hitpoints',combatXp/4)}
  // A defeated monster cannot retaliate on its killing blow.
  if(state.monsterHp<=0){
   const drops=[];
   for(const [item,n] of Object.entries(m.loot)){
    if(Math.random()<.65){const qty=Math.max(1,Math.floor(n*(.5+Math.random())));add(item,qty);drops.push(`${qty} ${item}`)}
   }
   const gem=rollTreasure();if(gem){add(gem);drops.push(gem)}
   note(`🏆 Defeated ${m.name}! Loot: ${drops.join(', ')||'Nothing'}`);
   state.monsterHp=m.hp;
  }else{
   const defenceRating=defence+(shield.defence||0);
   const enemyAccuracy=clamp(.65+.008*(m.atk-defenceRating),.10,.94);
   const rawHit=Math.random()<enemyAccuracy?1+Math.floor(Math.random()*m.maxHit):0;
   const mitigation=Math.floor((defence-1)/8)+(shield.block||0);
   const incoming=Math.max(0,rawHit-mitigation);
   state.hp=Math.max(0,state.hp-incoming);
  }
  // Food is used only after the exchange and only while the player is still alive.
  tryAutoEat();
  if(state.hp<=0){
   state.hp=maxHp();
   note(`💔 Defeated by ${m.name}! Respawned at full HP.`);
   stop();return;
  }
 }
 renderDynamic();save();
}
function tick(t){let dt=Math.min(250,t-lastTick);lastTick=t;if(state.active){state.progress+=dt/state.actionMs*100;if(state.progress>=100){state.progress-=100;complete()}renderProgress()}requestAnimationFrame(tick)}
const el=id=>document.getElementById(id);
const NAV_SKILLS=['combat',...Object.keys(SKILLS).filter(k=>!SKILLS[k].combat).sort((a,b)=>label(a).localeCompare(label(b),'en'))];
function renderNav(){
 el('nav').innerHTML=NAV_SKILLS.map(k=>`<button class=\"${currentSkill===k?'selected':''}\" data-skill=\"${k}\">${k==='combat'?'⚔️':SKILLS[k].icon} ${k==='combat'?'Combat':label(k)} <small>${k==='combat'?'4 skills':'Lv '+levelFromXp(state.xp[k])}</small></button>`).join('');
 document.querySelectorAll('[data-skill]').forEach(b=>b.onclick=()=>{currentSkill=b.dataset.skill;render()});
 const select=el('skillSelect');
 if(!select.options.length){select.innerHTML=NAV_SKILLS.map(k=>`<option value=\"${k}\">${k==='combat'?'⚔️ Combat':SKILLS[k].icon+' '+label(k)}</option>`).join('');select.onchange=()=>{currentSkill=select.value;render()}}
 select.value=currentSkill;
}
function renderMain(){if(currentSkill==='combat'){renderCombatMain();return}let skill=SKILLS[currentSkill],lvl=levelFromXp(state.xp[currentSkill]),xp=state.xp[currentSkill],min=xpForLevel(lvl),max=xpForLevel(Math.min(99,lvl+1));let html=`<h2>${skill.icon} ${label(currentSkill)}</h2><div class="muted" id="skillXpText">Level ${lvl} · ${Math.floor(xp)} XP ${lvl<99?`· ${Math.floor(max-xp)} XP to next level`:'· MAX LEVEL'}</div><div class="xpbar"><div id="skillXpFill" style="width:${lvl===99?100:(xp-min)/(max-min)*100}%"></div></div>`;
if(skill.combat){html+=`<p class="muted">Attack improves accuracy, Strength improves damage, Defence reduces incoming damage.</p><label>Train combat skill</label><select id="combatStyle">${['attack','strength','defence'].map(k=>`<option value="${k}" ${state.combatStyle===k?'selected':''}>${label(k)}</option>`).join('')}</select><h3>Monsters</h3>`+MONSTERS.map((m,i)=>`<div class="action"><div><b>${m.name}</b><br><small>Level ${m.level} · ${m.hp} HP · Loot: ${Object.keys(m.loot).join(', ')}</small></div><button data-monster="${i}">Fight</button></div>`).join('');}else{if(currentSkill==='agriculture'){html+=`<div class="tabs"><button id="cropsTab" class="${agricultureTab==='crops'?'selected':''}">🌾 Crops</button><button id="animalsTab" class="${agricultureTab==='animals'?'selected':''}">🐑 Animals</button></div>`}
if(currentSkill==='crafting'){html+=`<div class="tabs"><button id="equipmentCraftTab" class="${craftingTab==='equipment'?'selected':''}">🛡️ Gear</button><button id="gemsCraftTab" class="${craftingTab==='gems'?'selected':''}">💎 Gems</button><button id="materialsCraftTab" class="${craftingTab==='materials'?'selected':''}">🧶 Materials</button></div>`}html+=`<p class="muted">Each action takes 1 second (testing speed). Resources are added to your bank automatically.</p>`+skill.actions.map((a,i)=>({a,i})).filter(({a,i})=>(currentSkill!=='agriculture'||(agricultureTab==='crops'?i<3:i>=3))&&(currentSkill!=='crafting'||a[5]===craftingTab)).map(({a,i})=>`<div class="action"><div><b>${a[0]}</b><br><small>Lv ${a[2]} · +${a[3]} XP · +1 ${a[1]}</small>${a[4]?`<br><small>Requires: ${Object.entries(a[4]).map(([item,n])=>`${n} ${item}`).join(', ')}</small>`:''}</div><button data-action="${i}" data-req-level="${a[2]}" ${lvl<a[2]?'disabled':''}>${lvl<a[2]?'Locked':'Start'}</button></div>`).join('')}
html+=`<h3>Current activity</h3><div id="activityName" class="muted">Idle</div><div class="bar"><div class="fill" id="progressFill"></div></div><div id="progressText" class="muted">0%</div><button id="stopBtn">Stop activity</button>`;el('main').innerHTML=html;document.querySelectorAll('[data-action]').forEach(b=>b.onclick=()=>startAction(currentSkill,+b.dataset.action));document.querySelectorAll('[data-monster]').forEach(b=>b.onclick=()=>startCombat(+b.dataset.monster));let style=el('combatStyle');if(style)style.onchange=e=>state.combatStyle=e.target.value;el('stopBtn').onclick=stop;if(currentSkill==='agriculture'){el('cropsTab').onclick=()=>{agricultureTab='crops';renderMain()};el('animalsTab').onclick=()=>{agricultureTab='animals';renderMain()}}
if(currentSkill==='crafting'){
 el('equipmentCraftTab').onclick=()=>{craftingTab='equipment';renderMain()};
 el('gemsCraftTab').onclick=()=>{craftingTab='gems';renderMain()};
 el('materialsCraftTab').onclick=()=>{craftingTab='materials';renderMain()};
}renderProgress()}
function renderCombatMain(){
 const hpLevel=levelFromXp(state.xp.hitpoints),hpXp=state.xp.hitpoints||0;
 const hpMin=xpForLevel(hpLevel),hpNext=xpForLevel(Math.min(99,hpLevel+1));
 let html=`<h2>⚔️ Combat</h2><p class="muted">Choose which combat skill to train. Hitpoints always gains 25% of the XP earned in Attack, Strength or Defence.</p><div class="combat-styles">`;
 for(const k of ['attack','strength','defence']){
  const xp=state.xp[k]||0,lvl=levelFromXp(xp),min=xpForLevel(lvl),max=xpForLevel(Math.min(99,lvl+1));
  html+=`<button class="combat-choice ${state.combatStyle===k?'selected':''}" data-style="${k}"><strong>${SKILLS[k].icon} ${label(k)}</strong><span data-combat-xp="${k}">Level ${lvl} · ${Math.floor(xp)} XP</span><span class="xpbar"><span style="width:${lvl===99?100:(xp-min)/(max-min)*100}%"></span></span>${state.combatStyle===k?'✓ Training':'Train '+label(k)}</button>`;
 }
 html+=`</div><div class="health-panel"><h3>❤️ Hitpoints · Level <span id="hitpointsLevel">${hpLevel}</span></h3><div class="muted" id="hitpointsXpText">${Math.floor(hpXp)} XP ${hpLevel<99?'· '+Math.ceil(hpNext-hpXp)+' XP to next level':'· MAX LEVEL'}</div><div class="xpbar"><div id="hitpointsXpFill" style="width:${hpLevel===99?100:(hpXp-hpMin)/(hpNext-hpMin)*100}%"></div></div><h3>❤️ Health: <span id="combatHp">${state.hp}/${maxHp()}</span></h3><div class="bar health-bar"><div class="fill" id="healthFill" style="width:${state.hp/maxHp()*100}%"></div></div></div>`;
 html+=`<p class="muted">Each Hitpoints level adds 10 maximum HP (10 at level 1, 990 at level 99). Cooking provides stronger food as your HP increases.</p><div id="combatFood"></div><h3>Auto Eat</h3><div class="action" style="display:block"><label><input id="autoEatEnabled" type="checkbox" style="width:auto"> Enable Auto Eat</label><div style="display:flex;gap:8px;flex-wrap:wrap;margin-top:9px"><label style="flex:1;min-width:130px">Food<select id="autoEatFood" style="display:block;width:100%;padding:8px"></select></label><label style="flex:1;min-width:130px">Eat at HP<select id="autoEatThreshold" style="display:block;width:100%;padding:8px"><option value="15">15%</option><option value="30">30%</option><option value="50">50%</option></select></label></div><small class="muted">Uses chosen food from your bank after taking damage when HP is at or below the selected percentage. You can still die from a big hit.</small></div>`;
 html+=`<h3>Monsters</h3>`+MONSTERS.map((m,i)=>`<div class="action"><div><b>${m.name}</b><br><small>Level ${m.level} · ${m.hp} HP · Max hit ${m.maxHit} · Loot: ${Object.keys(m.loot).join(', ')}</small></div><button data-monster="${i}">Fight</button></div>`).join('');
 html+=`<details><summary>💎 Treasure Table (15% chance per kill)</summary><p class="muted">One random gem when the treasure roll succeeds. Weights are editable in TREASURE_TABLE.</p>${TREASURE_TABLE.map(([gem,weight])=>`<div class="item"><span>${gem}</span><span>${weight}% weight</span></div>`).join('')}</details>`;
 html+=`<h3>Current activity</h3><div id="activityName" class="muted">Idle</div><div class="bar"><div class="fill" id="progressFill"></div></div><div id="progressText" class="muted">0%</div><button id="stopBtn">Stop activity</button>`;
 el('main').innerHTML=html;
 document.querySelectorAll('[data-style]').forEach(b=>b.onclick=()=>{state.combatStyle=b.dataset.style;save();renderMain()});
 document.querySelectorAll('[data-monster]').forEach(b=>b.onclick=()=>startCombat(+b.dataset.monster));
 el('stopBtn').onclick=stop;
 renderFood();
 const enabled=el('autoEatEnabled'),food=el('autoEatFood'),threshold=el('autoEatThreshold');
 enabled.checked=state.autoEat.enabled;
 food.innerHTML=Object.keys(FOOD).map(k=>`<option value="${k}">${k} (+${FOOD[k]} HP) · owned ${count(k)}</option>`).join('');
 food.value=state.autoEat.food;threshold.value=String(state.autoEat.threshold);
 enabled.onchange=()=>{state.autoEat.enabled=enabled.checked;save()};
 food.onchange=()=>{state.autoEat.food=food.value;save()};
 threshold.onchange=()=>{state.autoEat.threshold=Number(threshold.value);save()};
 renderProgress();
}
function renderFood(){let box=el('combatFood');if(!box)return;let foods=Object.entries(FOOD).filter(([item])=>count(item)>0);box.innerHTML=foods.length?foods.map(([item,hp])=>`<button data-eat="${item}" ${state.hp>=maxHp()?'disabled':''}>🍽️ ${item} ×${count(item)} (+${hp} HP)</button>`).join(' '):'<p class="muted">No food yet. Catch fish and cook it, or harvest crops.</p>';box.querySelectorAll('[data-eat]').forEach(b=>b.onclick=()=>eat(b.dataset.eat))}
function renderProgress(){
 let name='Idle';
 if(state.active){
  if(state.active.type==='skill'){
   const a=SKILLS[state.active.skill].actions[state.active.index];
   name=`${SKILLS[state.active.skill].icon} ${a[0]}`;
  }else{
   name=`⚔️ ${MONSTERS[state.monsterIndex].name} · Enemy HP ${Math.max(0,state.monsterHp)}/${MONSTERS[state.monsterIndex].hp} · Your HP ${state.hp}/${maxHp()}`;
  }
 }
 el('activityName').textContent=name;
 el('progressFill').style.width=state.progress+'%';
 el('progressText').textContent=Math.floor(state.progress)+'%';
 if(el('combatHp'))el('combatHp').textContent=`${state.hp}/${maxHp()}`;
 if(el('healthFill'))el('healthFill').style.width=(state.hp/maxHp()*100)+'%';
}
function renderSidebar(){el('bankTab').className=sidebarTab==='bank'?'selected':'';el('gearTab').className=sidebarTab==='gear'?'selected':'';if(sidebarTab==='bank'){el('sidebar').innerHTML=`<input id="searchBank" placeholder="Search bank items..."><div id="bankItems"></div>`;el('searchBank').oninput=renderBankItems;renderBankItems()}else{el('sidebar').innerHTML=`<div class="item">Weapon: ${state.equipment.weapon||'None'} ${state.equipment.weapon?'<button data-unequip="weapon">Unequip</button>':''}</div><div class="item">Shield: ${state.equipment.shield||'None'} ${state.equipment.shield?'<button data-unequip="shield">Unequip</button>':''}</div><h3>Available equipment</h3>`+Object.entries(state.bank).filter(([k,n])=>n>0&&EQUIPMENT[k]).map(([k,n])=>`<div class="item"><span>${k} ×${n}</span><button data-equip="${k}">Equip</button></div>`).join('');document.querySelectorAll('[data-equip]').forEach(b=>b.onclick=()=>{let item=b.dataset.equip,slot=EQUIPMENT[item].slot;if(state.equipment[slot])add(state.equipment[slot]);add(item,-1);state.equipment[slot]=item;renderSidebar();save()});document.querySelectorAll('[data-unequip]').forEach(b=>b.onclick=()=>{let slot=b.dataset.unequip;add(state.equipment[slot]);state.equipment[slot]=null;renderSidebar();save()})}}
function renderBankItems(){let search=(el('searchBank')?.value||'').toLowerCase();let items=Object.entries(state.bank).filter(([k,n])=>n>0&&k.toLowerCase().includes(search)).sort(([a],[b])=>a.localeCompare(b));el('bankItems').innerHTML=items.length?items.map(([k,n])=>`<div class="item"><span>${k}</span><b>×${n}</b>${FOOD[k]?`<button data-eat="${k}" ${state.hp>=maxHp()?'disabled':''}>Eat +${FOOD[k]} HP</button>`:''}</div>`).join(''):'<p class="muted">No items found.</p>';el('bankItems').querySelectorAll('[data-eat]').forEach(b=>b.onclick=()=>eat(b.dataset.eat))}
function renderLog(){el('log').innerHTML=state.log.slice(0,25).map(x=>`<div>${x.replaceAll('&','&amp;').replaceAll('<','&lt;')}</div>`).join('')}
// Keep the currently visible XP information in sync after each completed action.
// Update only the counters/bars: rebuilding the entire main panel would reset tabs and controls.
function renderLiveXp(){
 if(currentSkill==='combat'){
  for(const skill of ['attack','strength','defence']){
   const counter=document.querySelector(`[data-combat-xp="${skill}"]`);
   if(!counter)continue;
   const xp=state.xp[skill]||0,lvl=levelFromXp(xp);
   const min=xpForLevel(lvl),max=xpForLevel(Math.min(99,lvl+1));
   const fill=counter.parentElement.querySelector('.xpbar > span');
   counter.textContent=`Level ${lvl} · ${Math.floor(xp)} XP`;
   if(fill)fill.style.width=(lvl===99?100:(xp-min)/(max-min)*100)+'%';
  }
  const hpXp=state.xp.hitpoints||0,hpLvl=levelFromXp(hpXp);
  const hpMin=xpForLevel(hpLvl),hpNext=xpForLevel(Math.min(99,hpLvl+1));
  if(el('hitpointsLevel'))el('hitpointsLevel').textContent=hpLvl;
  if(el('hitpointsXpText'))el('hitpointsXpText').textContent=`${Math.floor(hpXp)} XP ${hpLvl<99?'· '+Math.ceil(hpNext-hpXp)+' XP to next level':'· MAX LEVEL'}`;
  if(el('hitpointsXpFill'))el('hitpointsXpFill').style.width=(hpLvl===99?100:(hpXp-hpMin)/(hpNext-hpMin)*100)+'%';
 }else{
  const counter=el('skillXpText'),fill=el('skillXpFill');
  if(!counter||!fill)return;
  const xp=state.xp[currentSkill]||0,lvl=levelFromXp(xp);
  const min=xpForLevel(lvl),max=xpForLevel(Math.min(99,lvl+1));
  counter.textContent=`Level ${lvl} · ${Math.floor(xp)} XP ${lvl<99?`· ${Math.floor(max-xp)} XP to next level`:'· MAX LEVEL'}`;
  fill.style.width=(lvl===99?100:(xp-min)/(max-min)*100)+'%';
  // Unlock newly available actions immediately on level-up.
  document.querySelectorAll('#main [data-action][data-req-level]').forEach(button=>{
   const locked=lvl<Number(button.dataset.reqLevel);
   button.disabled=locked;
   button.textContent=locked?'Locked':'Start';
  });
 }
}
function renderDynamic(){renderNav();renderLiveXp();renderSidebar();renderFood();renderProgress();el('summary').textContent=`❤️ ${state.hp}/${maxHp()} HP (Lv ${levelFromXp(state.xp.hitpoints)}) · 🎒 ${Object.values(state.bank).reduce((a,b)=>a+b,0)} items · ${state.active?'Training':'Idle'}`}
function render(){renderNav();renderMain();renderSidebar();renderLog();renderDynamic()}
el('bankTab').onclick=()=>{sidebarTab='bank';renderSidebar()};el('gearTab').onclick=()=>{sidebarTab='gear';renderSidebar()};el('saveBtn').onclick=()=>{save();note('💾 Game saved.')};el('exportBtn').onclick=()=>{save();let blob=new Blob([JSON.stringify(state,null,2)],{type:'application/json'}),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download='idle-rpg-v2-save.json';a.click();setTimeout(()=>URL.revokeObjectURL(url),1000)};el('importBtn').onclick=()=>el('fileInput').click();el('fileInput').onchange=async e=>{let f=e.target.files[0];if(!f)return;try{let s=JSON.parse(await f.text());if(!s.xp||!s.bank)throw Error('Invalid save');localStorage.setItem(SAVE_KEY,JSON.stringify(s));restore();render();note('Save imported.')}catch(err){alert('Could not import save: '+err.message)}e.target.value=''};el('resetBtn').onclick=()=>{if(confirm('Delete your progress and start a new game?')){state=newGame();save();render()}};restore();render();requestAnimationFrame(tick);setInterval(save,15000);
</script></body></html>
