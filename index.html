<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Idle RPG v2</title><style>
:root{font-family:system-ui,Arial;background:#101827;color:#e9eef8}*{box-sizing:border-box}body{margin:0}header{padding:15px 20px;background:#18263b;display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}h1{font-size:21px;margin:0}button,select,input{font:inherit}button{background:#253b56;color:#fff;border:1px solid #45617f;border-radius:9px;padding:10px;cursor:pointer}button:hover,.selected{background:#34688a}button:disabled{opacity:.45;cursor:not-allowed}.layout{display:grid;grid-template-columns:210px minmax(0,1fr) 310px;gap:12px;padding:12px;max-width:1500px;margin:auto}.panel{background:#19263a;border:1px solid #2d4059;border-radius:12px;padding:14px;min-width:0}.nav{display:grid;gap:6px}.nav button{text-align:left}.stats{display:flex;gap:10px;flex-wrap:wrap;color:#b9cce2;font-size:13px}.action{border:1px solid #344e68;border-radius:10px;padding:12px;margin:9px 0;background:#1d3047;display:flex;justify-content:space-between;align-items:center;gap:8px}.action small{color:#b8cce0}.bar{height:17px;background:#0b1422;border-radius:20px;overflow:hidden;margin:12px 0}.fill{height:100%;width:0;background:linear-gradient(90deg,#1eab9c,#8cdb6a);transition:width .06s linear}.muted{color:#a8bad0}.tabs{display:flex;gap:6px;margin-bottom:10px}.tabs button{flex:1}.item{display:flex;justify-content:space-between;border-bottom:1px solid #31445b;padding:8px 0;gap:6px;align-items:center}.item button{padding:5px 8px}.log{font-size:13px;max-height:200px;overflow:auto;color:#c0d2e7}.log div{padding:3px 0;border-bottom:1px solid #263950}.xpbar{height:7px;background:#0c1421;border-radius:5px;overflow:hidden;margin-top:5px}.xpbar div{height:100%;background:#78bbf5}.controls{display:flex;gap:6px;flex-wrap:wrap}.controls button{font-size:12px;padding:7px}input{width:100%;background:#101a29;border:1px solid #3c5773;border-radius:7px;padding:9px;color:white}h2{font-size:19px;margin:0 0 8px}h3{font-size:15px;margin:12px 0 6px}.pill{display:inline-block;background:#30475e;border-radius:20px;padding:4px 9px;font-size:12px;margin:3px}.hidden{display:none}@media(max-width:950px){.layout{grid-template-columns:170px minmax(0,1fr)}.right{grid-column:1/-1}}@media(max-width:600px){.layout{grid-template-columns:1fr}.left{grid-column:1}.nav{display:flex;overflow:auto}.nav button{white-space:nowrap}.right{grid-column:1}.panel{padding:11px}header{padding:12px}}
</style></head><body><header><div><h1>⚔️ Idle RPG <span class="muted">v2.0</span></h1><div class="stats" id="summary"></div></div><div class="controls"><button id="saveBtn">Save</button><button id="exportBtn">Export</button><button id="importBtn">Import</button><button id="resetBtn">Reset</button><input type="file" id="fileInput" accept=".json,application/json" hidden></div></header><div class="layout"><aside class="panel left"><h3>Skills</h3><nav class="nav" id="nav"></nav></aside><main class="panel"><div id="main"></div></main><aside class="panel right"><div class="tabs"><button id="bankTab" class="selected">🏦 Bank</button><button id="gearTab">🛡️ Equipment</button></div><div id="sidebar"></div><h3>Activity log</h3><div class="log" id="log"></div></aside></div><script>
'use strict';
// Game content lives in data tables; adding a skill does not require rewriting the engine.
const SKILLS={
woodcutting:{icon:'🪓',actions:[['Normal Tree','Logs',1,10],['Oak Tree','Oak Logs',10,25],['Willow Tree','Willow Logs',25,45]]},
fishing:{icon:'🎣',actions:[['Shrimp Spot','Shrimp',1,10],['Trout Stream','Trout',10,30],['Salmon River','Salmon',20,50]]},
mining:{icon:'⛏️',actions:[['Copper Rock','Copper Ore',1,12],['Tin Rock','Tin Ore',1,12],['Iron Rock','Iron Ore',15,35]]},
smithing:{icon:'🔨',actions:[['Smelt Bronze Bar','Bronze Bar',1,25,{ 'Copper Ore':1,'Tin Ore':1}],['Forge Bronze Sword','Bronze Sword',5,45,{'Bronze Bar':2}],['Smelt Iron Bar','Iron Bar',15,45,{'Iron Ore':2}]]},
crafting:{icon:'🧵',actions:[['Craft Wooden Shield','Wooden Shield',1,25,{'Logs':3}],['Craft Oak Shield','Oak Shield',10,50,{'Oak Logs':3}]]},
cooking:{icon:'🍳',actions:[['Cook Shrimp','Cooked Shrimp',1,20,{'Shrimp':1}],['Cook Trout','Cooked Trout',10,40,{'Trout':1}],['Cook Salmon','Cooked Salmon',20,60,{'Salmon':1}]]},
farming:{icon:'🌱',actions:[['Grow Herbs','Herb',1,20],['Grow Potatoes','Potato',5,30],['Grow Berries','Berries',12,45]]},
animalHusbandry:{icon:'🐑',name:'Animal Husbandry',actions:[['Raise Chickens','Egg',1,20],['Tend Sheep','Wool',8,35],['Milk Cows','Milk',15,50]]},
herblore:{icon:'🧪',actions:[['Brew Healing Potion','Healing Potion',1,45,{'Herb':2,'Berries':1}],['Brew Strength Potion','Strength Potion',10,70,{'Herb':3,'Potato':1}]]},
attack:{icon:'🗡️',combat:true},strength:{icon:'💪',combat:true},defence:{icon:'🛡️',combat:true}
};
const MONSTERS=[{name:'Rat',level:1,hp:15,def:1,atk:3,loot:{'Rat Tail':1},xp:12},{name:'Goblin',level:8,hp:40,def:3,atk:7,loot:{'Coins':8},xp:30},{name:'Skeleton',level:18,hp:90,def:7,atk:13,loot:{'Bones':2},xp:65},{name:'Forest Guardian',level:30,hp:220,def:12,atk:20,loot:{'Ancient Token':1},xp:140}];
const EQUIPMENT={'Bronze Sword':{slot:'weapon',attack:3,strength:1},'Wooden Shield':{slot:'shield',defence:2},'Oak Shield':{slot:'shield',defence:5}};
const SAVE_KEY='idle-rpg-v2-save';const newGame=()=>({xp:Object.fromEntries(Object.keys(SKILLS).map(k=>[k,0])),bank:{},equipment:{weapon:null,shield:null},hp:100,monsterHp:null,monsterIndex:0,combatStyle:'attack',active:null,progress:0,actionMs:1000,log:[],lastSaved:Date.now()});let state=newGame(),currentSkill='woodcutting',sidebarTab='bank',lastTick=performance.now();
const levelFromXp=xp=>{let lvl=1,total=0;while(lvl<99){let needed=Math.floor(100*Math.pow(1.13,lvl-1));if(xp<total+needed)break;total+=needed;lvl++}return lvl};
const xpForLevel=lvl=>{let n=0;for(let i=1;i<lvl;i++)n+=Math.floor(100*Math.pow(1.13,i-1));return n};
const label=s=>SKILLS[s].name||s.replace(/([A-Z])/g,' $1').replace(/^./,c=>c.toUpperCase());
const count=item=>state.bank[item]||0;const add=(item,n=1)=>{state.bank[item]=Math.max(0,count(item)+n);if(!state.bank[item])delete state.bank[item]};
const canPay=cost=>!cost||Object.entries(cost).every(([item,n])=>count(item)>=n);
function note(msg){state.log.unshift(msg);state.log=state.log.slice(0,35);renderLog()}
function gainXp(skill,n){const before=levelFromXp(state.xp[skill]);state.xp[skill]+=n;const after=levelFromXp(state.xp[skill]);if(after>before)note(`✨ ${label(skill)} reached level ${after}!`)}
function save(){state.lastSaved=Date.now();localStorage.setItem(SAVE_KEY,JSON.stringify(state))}
function restore(){try{let s=JSON.parse(localStorage.getItem(SAVE_KEY));if(s&&s.xp&&s.bank){let base=newGame();state={...base,...s,xp:{...base.xp,...s.xp},equipment:{...base.equipment,...s.equipment},active:null,progress:0,monsterHp:null};let away=Math.min(8*3600,Math.max(0,(Date.now()-(s.lastSaved||Date.now()))/1000));if(away>60)note(`Welcome back! You were away for ${Math.floor(away/60)} minutes. Offline actions are paused in this prototype.`)}}catch(e){console.warn('Save could not be read',e)}}
function startAction(skill,index){let a=SKILLS[skill].actions[index];if(levelFromXp(state.xp[skill])<a[2])return;if(!canPay(a[4])){note('Missing ingredients.');return}state.active={type:'skill',skill,index};state.progress=0;render()}
function startCombat(index){state.monsterIndex=index;state.monsterHp=MONSTERS[index].hp;state.active={type:'combat'};state.progress=0;note(`⚔️ Fighting ${MONSTERS[index].name}`);render()}
function stop(){state.active=null;state.progress=0;render()}
function complete(){if(!state.active)return;if(state.active.type==='skill'){const {skill,index}=state.active,a=SKILLS[skill].actions[index];if(!canPay(a[4])){note('Not enough materials. Action stopped.');stop();return}for(let [item,n] of Object.entries(a[4]||{}))add(item,-n);add(a[1]);gainXp(skill,a[3]);note(`+1 ${a[1]} · +${a[3]} ${label(skill)} XP`)}else{let m=MONSTERS[state.monsterIndex],weapon=state.equipment.weapon?EQUIPMENT[state.equipment.weapon]:null,shield=state.equipment.shield?EQUIPMENT[state.equipment.shield]:null;let accuracy=Math.min(.96,.65+(levelFromXp(state.xp.attack)+(weapon?.attack||0)-m.def)*.012);let dmg=Math.random()<accuracy?Math.max(1,Math.floor(Math.random()*(3+levelFromXp(state.xp.strength)*.65+(weapon?.strength||0)))):0;state.monsterHp-=dmg;gainXp(state.combatStyle,m.xp/3);let incoming=Math.max(0,Math.floor(Math.random()*(m.atk+1)) -Math.floor(levelFromXp(state.xp.defence)/8)-(shield?.defence||0));state.hp=Math.max(0,state.hp-incoming);if(state.monsterHp<=0){for(let [item,n]of Object.entries(m.loot))add(item,n);note(`🏆 Defeated ${m.name}! Loot: ${Object.entries(m.loot).map(([i,n])=>`${n} ${i}`).join(', ')}`);state.monsterHp=m.hp}if(state.hp<=0){state.hp=100;note('💔 Defeated! Respawned with full HP.');stop();return}}renderDynamic();save()}
function tick(t){let dt=Math.min(250,t-lastTick);lastTick=t;if(state.active){state.progress+=dt/state.actionMs*100;if(state.progress>=100){state.progress-=100;complete()}renderProgress()}requestAnimationFrame(tick)}
const el=id=>document.getElementById(id);function renderNav(){el('nav').innerHTML=Object.keys(SKILLS).map(k=>`<button class="${currentSkill===k?'selected':''}" data-skill="${k}">${SKILLS[k].icon} ${label(k)} <small>Lv ${levelFromXp(state.xp[k])}</small></button>`).join('');document.querySelectorAll('[data-skill]').forEach(b=>b.onclick=()=>{currentSkill=b.dataset.skill;render()})}
function renderMain(){let skill=SKILLS[currentSkill],lvl=levelFromXp(state.xp[currentSkill]),xp=state.xp[currentSkill],min=xpForLevel(lvl),max=xpForLevel(Math.min(99,lvl+1));let html=`<h2>${skill.icon} ${label(currentSkill)}</h2><div class="muted">Level ${lvl} · ${Math.floor(xp)} XP ${lvl<99?`· ${Math.floor(max-xp)} XP to next level`:'· MAX LEVEL'}</div><div class="xpbar"><div style="width:${lvl===99?100:(xp-min)/(max-min)*100}%"></div></div>`;
if(skill.combat){html+=`<p class="muted">Attack improves accuracy, Strength improves damage, Defence reduces incoming damage.</p><label>Train combat skill</label><select id="combatStyle">${['attack','strength','defence'].map(k=>`<option value="${k}" ${state.combatStyle===k?'selected':''}>${label(k)}</option>`).join('')}</select><h3>Monsters</h3>`+MONSTERS.map((m,i)=>`<div class="action"><div><b>${m.name}</b><br><small>Level ${m.level} · ${m.hp} HP · Loot: ${Object.keys(m.loot).join(', ')}</small></div><button data-monster="${i}">Fight</button></div>`).join('');}else{html+=`<p class="muted">Each action takes 1 second (testing speed). Resources are added to your bank automatically.</p>`+skill.actions.map((a,i)=>`<div class="action"><div><b>${a[0]}</b><br><small>Lv ${a[2]} · +${a[3]} XP · +1 ${a[1]}</small>${a[4]?`<br><small>Requires: ${Object.entries(a[4]).map(([item,n])=>`${n} ${item}`).join(', ')}</small>`:''}</div><button data-action="${i}" ${lvl<a[2]?'disabled':''}>${lvl<a[2]?'Locked':'Start'}</button></div>`).join('')}
html+=`<h3>Current activity</h3><div id="activityName" class="muted">Idle</div><div class="bar"><div class="fill" id="progressFill"></div></div><div id="progressText" class="muted">0%</div><button id="stopBtn">Stop activity</button>`;el('main').innerHTML=html;document.querySelectorAll('[data-action]').forEach(b=>b.onclick=()=>startAction(currentSkill,+b.dataset.action));document.querySelectorAll('[data-monster]').forEach(b=>b.onclick=()=>startCombat(+b.dataset.monster));let style=el('combatStyle');if(style)style.onchange=e=>state.combatStyle=e.target.value;el('stopBtn').onclick=stop;renderProgress()}
function renderProgress(){let name='Idle';if(state.active){if(state.active.type==='skill'){let a=SKILLS[state.active.skill].actions[state.active.index];name=`${SKILLS[state.active.skill].icon} ${a[0]}`}else{name=`⚔️ ${MONSTERS[state.monsterIndex].name} · Enemy HP ${Math.max(0,state.monsterHp)}/${MONSTERS[state.monsterIndex].hp} · Your HP ${state.hp}/100`}}el('activityName').textContent=name;el('progressFill').style.width=state.progress+'%';el('progressText').textContent=Math.floor(state.progress)+'%'}
function renderSidebar(){el('bankTab').className=sidebarTab==='bank'?'selected':'';el('gearTab').className=sidebarTab==='gear'?'selected':'';if(sidebarTab==='bank'){el('sidebar').innerHTML=`<input id="searchBank" placeholder="Search bank items..."><div id="bankItems"></div>`;el('searchBank').oninput=renderBankItems;renderBankItems()}else{el('sidebar').innerHTML=`<div class="item">Weapon: ${state.equipment.weapon||'None'} ${state.equipment.weapon?'<button data-unequip="weapon">Unequip</button>':''}</div><div class="item">Shield: ${state.equipment.shield||'None'} ${state.equipment.shield?'<button data-unequip="shield">Unequip</button>':''}</div><h3>Available equipment</h3>`+Object.entries(state.bank).filter(([k,n])=>n>0&&EQUIPMENT[k]).map(([k,n])=>`<div class="item"><span>${k} ×${n}</span><button data-equip="${k}">Equip</button></div>`).join('');document.querySelectorAll('[data-equip]').forEach(b=>b.onclick=()=>{let item=b.dataset.equip,slot=EQUIPMENT[item].slot;if(state.equipment[slot])add(state.equipment[slot]);add(item,-1);state.equipment[slot]=item;renderSidebar();save()});document.querySelectorAll('[data-unequip]').forEach(b=>b.onclick=()=>{let slot=b.dataset.unequip;add(state.equipment[slot]);state.equipment[slot]=null;renderSidebar();save()})}}
function renderBankItems(){let search=(el('searchBank')?.value||'').toLowerCase();let items=Object.entries(state.bank).filter(([k,n])=>n>0&&k.toLowerCase().includes(search)).sort(([a],[b])=>a.localeCompare(b));el('bankItems').innerHTML=items.length?items.map(([k,n])=>`<div class="item"><span>${k}</span><b>×${n}</b></div>`).join(''):'<p class="muted">No items found.</p>'}
function renderLog(){el('log').innerHTML=state.log.slice(0,25).map(x=>`<div>${x.replaceAll('&','&amp;').replaceAll('<','&lt;')}</div>`).join('')}
function renderDynamic(){renderNav();renderSidebar();renderProgress();el('summary').textContent=`❤️ ${state.hp}/100 HP · 🎒 ${Object.values(state.bank).reduce((a,b)=>a+b,0)} items · ${state.active?'Training':'Idle'}`}
function render(){renderNav();renderMain();renderSidebar();renderLog();renderDynamic()}
el('bankTab').onclick=()=>{sidebarTab='bank';renderSidebar()};el('gearTab').onclick=()=>{sidebarTab='gear';renderSidebar()};el('saveBtn').onclick=()=>{save();note('💾 Game saved.')};el('exportBtn').onclick=()=>{save();let blob=new Blob([JSON.stringify(state,null,2)],{type:'application/json'}),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download='idle-rpg-v2-save.json';a.click();setTimeout(()=>URL.revokeObjectURL(url),1000)};el('importBtn').onclick=()=>el('fileInput').click();el('fileInput').onchange=async e=>{let f=e.target.files[0];if(!f)return;try{let s=JSON.parse(await f.text());if(!s.xp||!s.bank)throw Error('Invalid save');localStorage.setItem(SAVE_KEY,JSON.stringify(s));restore();render();note('Save imported.')}catch(err){alert('Could not import save: '+err.message)}e.target.value=''};el('resetBtn').onclick=()=>{if(confirm('Delete your progress and start a new game?')){state=newGame();save();render()}};restore();render();requestAnimationFrame(tick);setInterval(save,15000);
</script></body></html>
